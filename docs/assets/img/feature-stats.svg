<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="sglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6ee6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2f6ee6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ea2ff"/>
      <stop offset="1" stop-color="#1f6fe0"/>
    </linearGradient>
    <filter id="sshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <pattern id="sdots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#94b2ff" fill-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="960" height="640" fill="url(#sbg)"/>
  <ellipse cx="200" cy="140" rx="460" ry="320" fill="url(#sglow)"/>
  <ellipse cx="820" cy="560" rx="380" ry="260" fill="url(#sglow)"/>
  <rect width="960" height="640" fill="url(#sdots)"/>
  <g fill="#9dc1ff">
    <circle cx="560" cy="70" r="2" fill-opacity=".26"/>
    <circle cx="880" cy="120" r="2.2" fill-opacity=".3"/>
    <circle cx="60" cy="560" r="2" fill-opacity=".24"/>
    <circle cx="520" cy="600" r="2" fill-opacity=".2"/>
  </g>

  <!-- panel A: daily bars -->
  <g transform="translate(80 90)" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="470" height="460" rx="24" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#sshadow)"/>
    <text x="32" y="48" font-size="19" font-weight="600" fill="#e7eef9">逐日收支</text>
    <g font-size="13" fill="#8ca0bc">
      <circle cx="330" cy="43" r="4.5" fill="#3b8bff"/><text x="342" y="48">支出</text>
      <circle cx="390" cy="43" r="4.5" fill="#34d399"/><text x="402" y="48">收入</text>
    </g>
    <g stroke="#ffffff" stroke-opacity=".05">
      <line x1="32" y1="150" x2="438" y2="150"/>
      <line x1="32" y1="215" x2="438" y2="215"/>
      <line x1="32" y1="280" x2="438" y2="280"/>
    </g>
    <g>
      <rect x="44"  y="280" width="14" height="70"  rx="4" fill="url(#sbar)"/><rect x="62"  y="310" width="14" height="40" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="90"  y="240" width="14" height="110" rx="4" fill="url(#sbar)"/><rect x="108" y="284" width="14" height="66" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="136" y="290" width="14" height="60"  rx="4" fill="url(#sbar)"/><rect x="154" y="312" width="14" height="38" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="182" y="220" width="14" height="130" rx="4" fill="url(#sbar)"/><rect x="200" y="266" width="14" height="84" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="228" y="260" width="14" height="90"  rx="4" fill="url(#sbar)"/><rect x="246" y="294" width="14" height="56" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="274" y="200" width="14" height="150" rx="4" fill="url(#sbar)"/><rect x="292" y="254" width="14" height="96" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="320" y="266" width="14" height="84"  rx="4" fill="url(#sbar)"/><rect x="338" y="298" width="14" height="52" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="366" y="230" width="14" height="120" rx="4" fill="url(#sbar)"/><rect x="384" y="276" width="14" height="74" rx="4" fill="#34d399" fill-opacity=".9"/>
      <rect x="412" y="286" width="14" height="64"  rx="4" fill="url(#sbar)"/><rect x="430" y="310" width="14" height="40" rx="4" fill="#34d399" fill-opacity=".9"/>
    </g>
    <!-- highlight tag on tallest bar -->
    <g>
      <rect x="258" y="160" width="66" height="26" rx="9" fill="#3b8bff" fill-opacity=".2" stroke="#3b8bff" stroke-opacity=".55"/>
      <text x="291" y="177" font-size="12.5" fill="#cfe2ff" text-anchor="middle" font-weight="600">¥1,240</text>
      <line x1="285" y1="186" x2="281" y2="200" stroke="#3b8bff" stroke-opacity=".55"/>
    </g>
    <line x1="32" y1="350" x2="438" y2="350" stroke="#ffffff" stroke-opacity=".14"/>
    <g font-size="11" fill="#8ca0bc" text-anchor="middle">
      <text x="60" y="372">1</text><text x="106" y="372">2</text><text x="152" y="372">3</text><text x="198" y="372">4</text><text x="244" y="372">5</text><text x="290" y="372">6</text><text x="336" y="372">7</text><text x="382" y="372">8</text><text x="428" y="372">9</text>
    </g>
    <text x="32" y="418" font-size="14" fill="#8ca0bc">本周合计 <tspan fill="#e7eef9" font-weight="600">支出 ¥3,962</tspan></text>
    <text x="438" y="418" font-size="14" fill="#8ca0bc" text-anchor="end"><tspan fill="#34d399" font-weight="600">收入 ¥5,480</tspan></text>
  </g>

  <!-- panel B: category donut -->
  <g transform="translate(590 90)" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="290" height="460" rx="24" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#sshadow)"/>
    <text x="32" y="48" font-size="19" font-weight="600" fill="#e7eef9">类别分布</text>
    <g transform="translate(145 170)">
      <circle r="70" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="22"/>
      <g transform="rotate(-90)" fill="none" stroke-width="22">
        <circle r="70" stroke="#3b8bff" stroke-dasharray="180 439.8" stroke-dashoffset="0"/>
        <circle r="70" stroke="#38c6ff" stroke-dasharray="110 439.8" stroke-dashoffset="-184.7"/>
        <circle r="70" stroke="#f2c464" stroke-dasharray="76 439.8" stroke-dashoffset="-299"/>
        <circle r="70" stroke="#64748b" stroke-dasharray="59 439.8" stroke-dashoffset="-379.2"/>
      </g>
      <text y="2" font-size="19" font-weight="700" fill="#eef4fd" text-anchor="middle">¥12,480</text>
      <text y="26" font-size="12" fill="#8ca0bc" text-anchor="middle">总支出</text>
    </g>
    <g font-size="14.5" fill="#c7d3e6">
      <circle cx="36" cy="330" r="5" fill="#3b8bff"/><text x="52" y="335">餐饮 · 42%</text><text x="254" y="335" fill="#8ca0bc" text-anchor="end">¥5,240</text>
      <circle cx="36" cy="372" r="5" fill="#38c6ff"/><text x="52" y="377">购物 · 26%</text><text x="254" y="377" fill="#8ca0bc" text-anchor="end">¥3,245</text>
      <circle cx="36" cy="414" r="5" fill="#f2c464"/><text x="52" y="419">交通 · 18%</text><text x="254" y="419" fill="#8ca0bc" text-anchor="end">¥2,246</text>
      <circle cx="36" cy="456" r="5" fill="#64748b"/><text x="52" y="461">其他 · 14%</text><text x="254" y="461" fill="#8ca0bc" text-anchor="end">¥1,749</text>
    </g>
  </g>
</svg>
