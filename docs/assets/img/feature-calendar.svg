<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6ee6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f6ee6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="todayG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b95ff"/>
      <stop offset="1" stop-color="#1f6fe0"/>
    </linearGradient>
    <radialGradient id="fabG" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#5ea2ff"/>
      <stop offset="1" stop-color="#1f6fe0"/>
    </radialGradient>
    <filter id="cshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <filter id="csoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="cdots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#94b2ff" fill-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="960" height="640" fill="url(#cbg)"/>
  <ellipse cx="280" cy="120" rx="460" ry="320" fill="url(#cglow)"/>
  <ellipse cx="880" cy="600" rx="360" ry="240" fill="url(#cglow)"/>
  <rect width="960" height="640" fill="url(#cdots)"/>
  <g fill="#9dc1ff">
    <circle cx="620" cy="80" r="2" fill-opacity=".28"/>
    <circle cx="760" cy="60" r="2.4" fill-opacity=".34"/>
    <circle cx="900" cy="200" r="1.8" fill-opacity=".24"/>
    <circle cx="920" cy="420" r="2" fill-opacity=".26"/>
    <circle cx="640" cy="600" r="2" fill-opacity=".22"/>
  </g>

  <!-- calendar panel -->
  <g transform="translate(90 80)" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="520" height="480" rx="24" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#cshadow)"/>
    <text x="32" y="52" font-size="21" font-weight="600" fill="#e7eef9">2026年9月</text>
    <g fill="none" stroke="#8ca0bc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="448" cy="45" r="13" stroke-opacity=".5"/>
      <circle cx="480" cy="45" r="13" stroke-opacity=".5"/>
      <path d="M452 45 l-4 -4 4 -4 M476 45 l4 -4 -4 -4" transform="translate(0 0)"/>
    </g>
    <g font-size="13" fill="#8ca0bc" text-anchor="middle">
      <text x="72" y="96">一</text><text x="138" y="96">二</text><text x="204" y="96">三</text><text x="270" y="96">四</text><text x="336" y="96">五</text><text x="402" y="96">六</text><text x="468" y="96">日</text>
    </g>
    <!-- cells: 7 cols x 5 rows, cell 52, x=46+col*66, y=112+row*60 -->
    <g fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".07">
      <rect x="46" y="112" width="52" height="52" rx="12"/>
      <rect x="112" y="112" width="52" height="52" rx="12"/><rect x="178" y="112" width="52" height="52" rx="12"/><rect x="244" y="112" width="52" height="52" rx="12"/><rect x="310" y="112" width="52" height="52" rx="12"/><rect x="376" y="112" width="52" height="52" rx="12"/><rect x="442" y="112" width="52" height="52" rx="12"/>
      <rect x="46" y="172" width="52" height="52" rx="12"/><rect x="112" y="172" width="52" height="52" rx="12"/><rect x="178" y="172" width="52" height="52" rx="12"/><rect x="244" y="172" width="52" height="52" rx="12"/><rect x="310" y="172" width="52" height="52" rx="12"/><rect x="376" y="172" width="52" height="52" rx="12"/><rect x="442" y="172" width="52" height="52" rx="12"/>
      <rect x="46" y="232" width="52" height="52" rx="12"/><rect x="112" y="232" width="52" height="52" rx="12"/><rect x="178" y="232" width="52" height="52" rx="12"/><rect x="244" y="232" width="52" height="52" rx="12"/><rect x="310" y="232" width="52" height="52" rx="12"/><rect x="376" y="232" width="52" height="52" rx="12"/><rect x="442" y="232" width="52" height="52" rx="12"/>
      <rect x="46" y="292" width="52" height="52" rx="12"/><rect x="112" y="292" width="52" height="52" rx="12"/><rect x="178" y="292" width="52" height="52" rx="12"/><rect x="244" y="292" width="52" height="52" rx="12"/><rect x="310" y="292" width="52" height="52" rx="12"/><rect x="376" y="292" width="52" height="52" rx="12"/><rect x="442" y="292" width="52" height="52" rx="12"/>
      <rect x="46" y="352" width="52" height="52" rx="12"/><rect x="112" y="352" width="52" height="52" rx="12"/><rect x="178" y="352" width="52" height="52" rx="12"/>
    </g>
    <!-- today: Sep 26, row3 col5 -->
    <rect x="376" y="292" width="52" height="52" rx="12" fill="url(#todayG)" stroke="#8db8ff" stroke-opacity=".8" filter="url(#cshadow)"/>
    <g font-size="15" fill="#c3cfdf" text-anchor="middle">
      <text x="72" y="142" fill-opacity=".45">31</text>
      <text x="138" y="142">1</text><text x="204" y="142">2</text><text x="270" y="142">3</text><text x="336" y="142">4</text><text x="402" y="142">5</text><text x="468" y="142">6</text>
      <text x="72" y="202">7</text><text x="138" y="202">8</text><text x="204" y="202">9</text><text x="270" y="202">10</text><text x="336" y="202">11</text><text x="402" y="202">12</text><text x="468" y="202">13</text>
      <text x="72" y="262">14</text><text x="138" y="262">15</text><text x="204" y="262">16</text><text x="270" y="262">17</text><text x="336" y="262">18</text><text x="402" y="262">19</text><text x="468" y="262">20</text>
      <text x="72" y="322">21</text><text x="138" y="322">22</text><text x="204" y="322">23</text><text x="270" y="322">24</text><text x="336" y="322">25</text>
      <text x="402" y="322" font-weight="700" fill="#ffffff" font-size="16">26</text>
      <text x="468" y="322">27</text>
      <text x="72" y="382">28</text><text x="138" y="382">29</text><text x="204" y="382">30</text>
    </g>
    <!-- record dots -->
    <g>
      <circle cx="204" cy="152" r="3.5" fill="#3b8bff"/>
      <circle cx="270" cy="152" r="3.5" fill="#38c6ff"/>
      <circle cx="336" cy="152" r="3.5" fill="#f2c464"/>
      <circle cx="72" cy="212" r="3.5" fill="#38c6ff"/>
      <circle cx="138" cy="212" r="3.5" fill="#3b8bff"/>
      <circle cx="244" cy="272" r="3.5" fill="#f2c464"/>
      <circle cx="310" cy="272" r="3.5" fill="#3b8bff"/>
      <circle cx="468" cy="272" r="3.5" fill="#38c6ff"/>
      <circle cx="138" cy="332" r="3.5" fill="#34d399"/>
      <circle cx="402" cy="332" r="3.5" fill="#34d399"/>
      <circle cx="178" cy="392" r="3.5" fill="#3b8bff"/>
    </g>
    <!-- summary -->
    <line x1="32" y1="432" x2="488" y2="432" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="32" y="462" font-size="15" fill="#8ca0bc">本月支出 <tspan fill="#e7eef9" font-weight="600">¥12,480</tspan></text>
    <text x="488" y="462" font-size="15" fill="#8ca0bc" text-anchor="end">本月收入 <tspan fill="#34d399" font-weight="600">¥18,600</tspan></text>
  </g>

  <!-- floating transaction chips -->
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(660 140)">
      <rect width="240" height="76" rx="16" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#cshadow)"/>
      <circle cx="34" cy="38" r="16" fill="#3b8bff" fill-opacity=".18" stroke="#3b8bff" stroke-opacity=".5"/>
      <text x="34" y="44" font-size="15" fill="#7db4ff" text-anchor="middle" font-weight="700">¥</text>
      <text x="62" y="33" font-size="14" fill="#8ca0bc">餐饮 · 午餐</text>
      <text x="62" y="57" font-size="18" font-weight="600" fill="#e7eef9">¥86.00</text>
    </g>
    <g transform="translate(690 252)">
      <rect width="240" height="76" rx="16" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#cshadow)"/>
      <circle cx="34" cy="38" r="16" fill="#38c6ff" fill-opacity=".16" stroke="#38c6ff" stroke-opacity=".5"/>
      <text x="34" y="44" font-size="15" fill="#7dd4ff" text-anchor="middle" font-weight="700">¥</text>
      <text x="62" y="33" font-size="14" fill="#8ca0bc">交通 · 地铁</text>
      <text x="62" y="57" font-size="18" font-weight="600" fill="#e7eef9">¥23.50</text>
    </g>
    <g transform="translate(655 364)">
      <rect width="240" height="76" rx="16" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#cshadow)"/>
      <circle cx="34" cy="38" r="16" fill="#f2c464" fill-opacity=".16" stroke="#f2c464" stroke-opacity=".5"/>
      <text x="34" y="44" font-size="15" fill="#f6d488" text-anchor="middle" font-weight="700">¥</text>
      <text x="62" y="33" font-size="14" fill="#8ca0bc">购物 · 键盘</text>
      <text x="62" y="57" font-size="18" font-weight="600" fill="#e7eef9">¥399.00</text>
    </g>
    <!-- FAB -->
    <circle cx="858" cy="540" r="44" fill="#3b8bff" fill-opacity=".14" filter="url(#csoft)"/>
    <circle cx="858" cy="540" r="30" fill="url(#fabG)" stroke="#9cc4ff" stroke-opacity=".6"/>
    <path d="M858 528 v24 M846 540 h24" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
