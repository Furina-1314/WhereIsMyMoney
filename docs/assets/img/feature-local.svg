<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <radialGradient id="lglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6ee6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f6ee6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lglowMint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="lshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <filter id="lsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="ldots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#94b2ff" fill-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="960" height="640" fill="url(#lbg)"/>
  <ellipse cx="400" cy="300" rx="480" ry="330" fill="url(#lglow)"/>
  <ellipse cx="700" cy="330" rx="300" ry="260" fill="url(#lglowMint)"/>
  <rect width="960" height="640" fill="url(#ldots)"/>
  <g fill="#9dc1ff">
    <circle cx="180" cy="120" r="2" fill-opacity=".26"/>
    <circle cx="840" cy="90" r="2.2" fill-opacity=".3"/>
    <circle cx="120" cy="480" r="2" fill-opacity=".22"/>
    <circle cx="880" cy="560" r="2" fill-opacity=".24"/>
  </g>
  <g stroke="#cfe0ff" stroke-width="2" stroke-linecap="round" opacity=".45">
    <path d="M240 220v14M233 227h14"/>
    <path d="M560 540v14M553 547h14"/>
  </g>

  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <!-- database cylinder -->
    <g>
      <path d="M282 190 V400 A118 34 0 0 0 518 400 V190" fill="#3b8bff" fill-opacity=".08" stroke="#7db4ff" stroke-opacity=".55" stroke-width="2"/>
      <ellipse cx="400" cy="190" rx="118" ry="34" fill="#131f38" stroke="#7db4ff" stroke-opacity=".7" stroke-width="2"/>
      <path d="M282 260 A118 34 0 0 0 518 260" fill="none" stroke="#7db4ff" stroke-opacity=".22" stroke-width="1.6"/>
      <path d="M282 330 A118 34 0 0 0 518 330" fill="none" stroke="#7db4ff" stroke-opacity=".22" stroke-width="1.6"/>
      <rect x="330" y="236" width="110" height="9" rx="4.5" fill="#ffffff" fill-opacity=".1"/>
      <rect x="330" y="306" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity=".08"/>
    </g>
    <text x="400" y="478" font-size="15" fill="#9db7dd" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace">whereismymoney.sqlite</text>

    <!-- floating data rows behind left -->
    <g fill="#101a30" fill-opacity=".6" stroke="#ffffff" stroke-opacity=".1">
      <rect x="120" y="330" width="200" height="58" rx="14"/>
      <rect x="100" y="400" width="220" height="58" rx="14"/>
    </g>
    <g fill="#ffffff" fill-opacity=".14">
      <rect x="140" y="352" width="90" height="9" rx="4.5"/>
      <rect x="140" y="368" width="60" height="7" rx="3.5" fill-opacity=".1"/>
      <rect x="122" y="422" width="110" height="9" rx="4.5"/>
      <rect x="122" y="438" width="70" height="7" rx="3.5" fill-opacity=".1"/>
    </g>

    <!-- shield -->
    <g>
      <path d="M680 218 c 40 22 76 30 76 30 v 72 c 0 60 -44 94 -76 108 c -32 -14 -76 -48 -76 -108 v -72 s 36 -8 76 -30 z"
            fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-opacity=".6" stroke-width="2.5"/>
      <path d="M636 322 l32 32 58 -62" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="680" cy="320" r="120" fill="#34d399" fill-opacity=".06" filter="url(#lsoft)"/>
    </g>

    <!-- chips -->
    <g transform="translate(700 96)">
      <rect width="200" height="66" rx="16" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#lshadow)"/>
      <rect x="24" y="24" width="20" height="16" rx="4" fill="none" stroke="#7db4ff" stroke-width="2"/>
      <path d="M28 24 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#7db4ff" stroke-width="2"/>
      <text x="58" y="30" font-size="14.5" fill="#e7eef9" font-weight="600">本地保存</text>
      <text x="58" y="50" font-size="12" fill="#8ca0bc">数据不出你的电脑</text>
    </g>
    <g transform="translate(736 500)">
      <rect width="200" height="66" rx="16" fill="#101a30" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".13" filter="url(#lshadow)"/>
      <circle cx="34" cy="33" r="10" fill="none" stroke="#7db4ff" stroke-width="2"/>
      <line x1="24" y1="23" x2="44" y2="43" stroke="#7db4ff" stroke-width="2" stroke-linecap="round"/>
      <text x="58" y="30" font-size="14.5" fill="#e7eef9" font-weight="600">离线可用</text>
      <text x="58" y="50" font-size="12" fill="#8ca0bc">无广告 · 无账号</text>
    </g>
  </g>
</svg>
